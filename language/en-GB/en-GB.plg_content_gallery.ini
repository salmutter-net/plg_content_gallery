PLG_CONTENT_GALLERY="Content - Gallery (PhotoSwipe)"
PLG_CONTENT_GALLERY_XML_DESCRIPTION="Shows images from a folder as thumbnails inside article text. Clicking a thumbnail opens a PhotoSwipe gallery. Usage: {gallery}folder{/gallery}"

PLG_CONTENT_GALLERY_FIELDSET_THUMBNAILS="Thumbnails"
PLG_CONTENT_GALLERY_FIELDSET_FULL="Full image (PhotoSwipe)"

PLG_CONTENT_GALLERY_COLUMNS_LABEL="Images per row"
PLG_CONTENT_GALLERY_COLUMNS_DESC="Number of thumbnails per row on desktop (grid columns). Small screens always use 2 columns."
PLG_CONTENT_GALLERY_THUMB_MAX_HEIGHT_LABEL="Thumbnail max height"
PLG_CONTENT_GALLERY_THUMB_MAX_HEIGHT_DESC="Maximum display height of a thumbnail in px (CSS)."

PLG_CONTENT_GALLERY_THUMB_WIDTH_LABEL="Thumbnail width"
PLG_CONTENT_GALLERY_THUMB_WIDTH_DESC="Maximum width of generated thumbnails in px (fit=contain)."
PLG_CONTENT_GALLERY_THUMB_HEIGHT_LABEL="Thumbnail height"
PLG_CONTENT_GALLERY_THUMB_HEIGHT_DESC="Maximum height of generated thumbnails in px (fit=contain)."
PLG_CONTENT_GALLERY_THUMB_SRCSET_LABEL="Thumbnail srcset widths"
PLG_CONTENT_GALLERY_THUMB_SRCSET_DESC="Comma-separated list of additional widths for the thumbnail srcset attribute (e.g. 788,1182 for 2x/3x). Empty = no srcset."
PLG_CONTENT_GALLERY_THUMB_SIZES_LABEL="Thumbnail sizes attribute"
PLG_CONTENT_GALLERY_THUMB_SIZES_DESC="Value of the sizes attribute for thumbnails (e.g. (max-width: 600px) 50vw, 394px)."

PLG_CONTENT_GALLERY_FULL_WIDTH_LABEL="Image width"
PLG_CONTENT_GALLERY_FULL_WIDTH_DESC="Maximum width of the large image in px (fit=contain)."
PLG_CONTENT_GALLERY_FULL_HEIGHT_LABEL="Image height"
PLG_CONTENT_GALLERY_FULL_HEIGHT_DESC="Maximum height of the large image in px (fit=contain)."
PLG_CONTENT_GALLERY_FULL_SRCSET_LABEL="srcset widths"
PLG_CONTENT_GALLERY_FULL_SRCSET_DESC="Comma-separated list of widths for responsive images in the PhotoSwipe view (e.g. 480,768,1024,1660). Empty = no srcset."
PLG_CONTENT_GALLERY_FULL_SIZES_LABEL="sizes attribute"
PLG_CONTENT_GALLERY_FULL_SIZES_DESC="Value of the sizes attribute for the large image (e.g. 100vw or (max-width: 1660px) 100vw, 1660px)."
